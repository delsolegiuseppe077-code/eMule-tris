<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CITOFONO</title><style>body{font-family:Arial;text-align:center;background:#fff5f5}h1{color:#d32f2f}.card{background:#fff;border-radius:18px;padding:16px;margin:12px;box-shadow:0 2px 6px #aaa}input,textarea{font-size:19px;padding:10px;width:90%;border:2px solid #d32f2f;border-radius:10px}button{font-size:20px;padding:15px;width:95%;margin:7px;border-radius:12px;border:none;font-weight:bold}.sos{background:#d32f2f;color:#fff;font-size:26px;padding:24px}.male{background:#ff6f00;color:#fff;font-size:22px;padding:20px}.ok{background:#2e7d32;color:#fff}.blu{background:#1976d2;color:#fff}.giallo{background:#ffeb3b}.verde{background:#388e3c;color:#fff}</style></head><body><h1>🛡️ CITOFONO<br>Tiziana e Giuseppe</h1><div id="a" class="card"><h2>Configura</h2>Numero:<br><input id="n" type="tel" placeholder="3331234567"><br>Indirizzo:<br><textarea id="i" rows="2" placeholder="Villanova Mondovi, Via..."></textarea><br><button class="ok" onclick="S()">SALVA</button></div><div id="b" style="display:none"><div class="card"><p>Num: <b id="sn"></b> <a href="#" onclick="localStorage.clear();location.reload()">cambia</a><br><span id="si"></span></p><button class="sos" onclick="E('f')">🆘 AIUTO<br>FAMIGLIA</button><button class="male" onclick="E('s')">🚑 STO MALE<br>118</button></div><div class="card"><h3>Citofono</h3><button class="blu" onclick="P('Chi e? Dica chi e!')">CHI E?</button><button class="giallo" onclick="P('Non la conosco, vada via, non apro!')">VADA VIA</button><button class="verde" onclick="P('Si, puo salire, apro')">PUO SALIRE</button></div></div><script>function S(){let x=document.getElementById('n').value.replace(/[^0-9+]/g,'');let y=document.getElementById('i').value;if(x.length<8)return alert('Numero?');if(y.length<5)return alert('Indirizzo?');localStorage.setItem('nn',x);localStorage.setItem('ii',y);A();}function A(){let x=localStorage.getItem('nn');let y=localStorage.getItem('ii');if(!x||!y){document.getElementById('a').style.display='block';document.getElementById('b').style.display='none';return;}document.getElementById('a').style.display='none';document.getElementById('b').style.display='block';document.getElementById('sn').innerText=x;document.getElementById('si').innerText=y;}function P(t){try{speechSynthesis.cancel()}catch(e){}let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=0.85;speechSynthesis.speak(u);}function E(k){let y=localStorage.getItem('ii');let x=localStorage.getItem('nn');if(k=='f'){P('Aiuto Aiuto Sono a '+y+' Venite subito');setTimeout(()=>{if(confirm('CHIAMO '+x+'?'))location.href='tel:'+x},2500);}else{P('Aiuto Sto male Chiamate ambulanza Sono a '+y);document.body.style.background='red';setTimeout(()=>{document.body.style.background='#fff5f5';if(confirm('CHIAMO 118?'))location.href='tel:118'},4000);}}A();</script></body></html>
