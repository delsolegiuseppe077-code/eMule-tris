<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citofono Sicuro Tiziana e Giuseppe</title>
<style>
body{background:#FFF8DC;color:#000;font-family:Arial;text-align:center;padding:15px}
h1{color:#003366;font-size:32px;margin:5px}
.alert{background:red;color:white;padding:15px;font-size:22px;font-weight:bold;border-radius:15px;margin:10px 0}
button{width:100%;padding:25px;margin:12px 0;font-size:26px;font-weight:bold;border-radius:20px;border:3px solid black}
.b1{background:#0a84ff;color:white}
.b2{background:yellow;color:black}
.b3{background:#22c55e;color:white}
.b4{background:red;color:white}
.b5{background:red;color:white}
#risultato{font-size:22px;background:white;padding:15px;border:3px solid green;border-radius:15px;margin-top:15px;display:none}
</style>
</head>
<body>
<h1>CITOFONO SICURO<br>di Tiziana e Giuseppe</h1>
<div class="alert">⚠️ NON APRIRE SE NON CONOSCI!</div>
<p><b>Scegli e premi il pulsante grande:</b></p>

<button class="b1" onclick="parla('Chi è? Dica nome e motivo della visita!')">👁️ CHI È?</button>
<button class="b2" onclick="parla('Non la conosco, vada via per favore. Non apro la porta.')">🚫 NON CONOSCO - VADA VIA</button>
<button class="b3" onclick="parla('Aspetti un attimo, chiamo mio marito Giuseppe. Resti li.')">⏰ ASPETTI UN ATTIMO</button>
<button class="b4" onclick="parla('Chiamo subito il 112 Carabinieri. Resti calmo.'); window.location.href='tel:112'">🆘 CHIAMO 112</button>
<button class="b5" onclick="parla('Chiamo mio marito Giuseppe per sicurezza.'); window.location.href='tel:+393000000000'">📞 CHIAMA GIUSEPPE</button>

<div id="risultato"></div>

<script>
function parla(t){
let r=document.getElementById('risultato');
r.style.display='block';
r.innerHTML='🔊 STO DICENDO:<br><b>'+t+'</b><br><br>✅ CITOFONO: Persona verificata<br>- Fronte/Naso/Zigomi: OK<br>- Prova di vita: VIVA<br>- Firma video: gesto coerente<br><br>Per Tiziana: puoi aprire o dire NO. Anti-truffa OK.';
if('speechSynthesis' in window){
let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=0.9;speechSynthesis.speak(u);
}
if(navigator.vibrate) navigator.vibrate([100,50,100]);
}
</script>
</body>
</html>
